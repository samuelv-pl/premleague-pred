name: Sync fixtures and results

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes so live scores stay fresh (public repo: Actions minutes are free)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print what would change, write nothing)"
        type: boolean
        default: true

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run sync
        run: python3 sync/sync_fixtures.py ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
